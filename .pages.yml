# Pages CMS: the editing screens at https://app.pagescms.org for this site.
# Docs: https://pagescms.org/docs/  ·  How to use it: docs/editing-guide.md
#
# Each entry under `content` is one section of the CMS sidebar. The fields match the front matter that
# src/content.config.ts expects, so anything saved here builds. Keys the CMS doesn't show (such as
# `published` or `redirectTo`) are kept as they are when an entry is saved (settings.content.merge).
#
# The drop-down lists under `components` mirror src/data/taxonomies.json and src/data/countries.json.
# When you add a cuisine, venue type or country there, add it here too, with the same slug.

settings:
  content:
    merge: true

media:
  - name: media
    label: Photos
    input: public/media
    output: /media
    categories: [image]
    rename: safe
  - name: site
    label: Site images
    input: public/site
    output: /site
    categories: [image]
    rename: safe

